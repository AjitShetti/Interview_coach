<style>
        body {
            background-color: #0D0D0D;
            color: #F0EBE1;
        }
        
        .auth-card {
            background-color: #141414;
            border: 1px solid #2A2A2A;
            border-radius: 8px;
        }

        .auth-input {
            background-color: #141414;
            border: 1px solid #2A2A2A;
            color: #F0EBE1;
            transition: all 0.2s ease;
        }

        .auth-input:focus {
            outline: none;
            border-color: #D4A853;
            box-shadow: 0 0 0 1px #D4A853;
        }

        .auth-btn-primary {
            background-color: #D4A853;
            color: #271900;
            border-radius: 4px;
            transition: transform 0.1s ease;
        }

        .auth-btn-primary:active {
            transform: scale(0.98);
        }

        .auth-btn-secondary {
            background-color: transparent;
            border: 1px solid #2A2A2A;
            color: #F0EBE1;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .auth-btn-secondary:hover {
            background-color: #1C1C1C;
        }
        
        .auth-btn-secondary:active {
            transform: scale(0.98);
        }
        
        /* Subtle glowing background effect */
        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(212, 168, 83, 0.05) 0%, rgba(13, 13, 13, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden font-body text-body">
<div class="bg-glow"></div>
<main class="w-full max-w-md px-gutter-mobile relative z-10">
<!-- Logo / Branding Header -->
<div class="text-center mb-xl">
<h1 class="font-headline-lg text-headline-lg text-[#F0EBE1] tracking-tight mb-xs">Interview Coach</h1>
<p class="font-body text-body text-text-secondary">Premium AI-Powered Interview Preparation</p>
</div>
<!-- Auth Card -->
<div class="auth-card p-lg shadow-[0_0_40px_rgba(0,0,0,0.5)]">
<div class="flex items-center justify-between mb-md border-b border-border-base pb-sm">
<h2 class="font-headline-md text-headline-md text-[#F0EBE1]">Sign In</h2>
<span class="font-mono-sm text-mono-sm text-text-secondary uppercase">Secure Access</span>
</div>
<form class="space-y-md" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="space-y-xs">
<label class="block font-mono-sm text-mono-sm text-[#8A8277]" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-secondary" style="font-variation-settings: 'FILL' 0;">mail</span>
<input class="auth-input w-full py-2 pl-10 pr-3 font-body text-body rounded-md" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="block font-mono-sm text-mono-sm text-[#8A8277]" for="password">Password</label>
<a class="font-body-sm text-body-sm text-text-secondary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-secondary" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="auth-input w-full py-2 pl-10 pr-3 font-body text-body rounded-md" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="auth-btn-primary w-full py-3 font-body text-body font-medium flex items-center justify-center gap-2 mt-md" type="submit">
                    Sign In
                    <span class="material-symbols-outlined" style="font-size: 20px;">arrow_forward</span>
</button>
</form>
<div class="mt-lg relative flex items-center justify-center">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-border-base"></div>
</div>
<div class="relative bg-[#141414] px-4 font-mono-sm text-mono-sm text-text-secondary">
                    OR CONTINUE WITH
                </div>
</div>
<div class="mt-md flex gap-sm">
<button class="auth-btn-secondary flex-1 py-2 flex items-center justify-center gap-2 font-body-sm text-body-sm" type="button">
<span class="material-symbols-outlined" style="font-size: 18px;">business</span>
                    SSO
                </button>
<button class="auth-btn-secondary flex-1 py-2 flex items-center justify-center gap-2 font-body-sm text-body-sm" type="button">
<span class="material-symbols-outlined" style="font-size: 18px;">account_circle</span>
                    Google
                </button>
</div>
</div>
<!-- Footer Links -->
<div class="text-center mt-md">
<p class="font-body-sm text-body-sm text-text-secondary">
                Don't have an account? 
                <a class="text-primary-container hover:text-[#F0EBE1] transition-colors" href="#">Request Access</a>
</p>
</div>
</main>
<script>
        // Simple input focus styling script to ensure reliable focus states
        document.querySelectorAll('.auth-input').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.querySelector('.material-symbols-outlined').style.color = '#D4A853';
            });
            input.addEventListener('blur', function() {
                this.parentElement.querySelector('.material-symbols-outlined').style.color = '#8A8277';
            });
        });
    </script>
</body></html>
